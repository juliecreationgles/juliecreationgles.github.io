<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur de devis — Julie Créationgles</title>
<meta name="description" content="Simulez votre devis de formation en prothésie ongulaire : choisissez vos formations et votre mode de financement, le total s'affiche aussitôt.">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
#sim fieldset{border:1px solid rgba(201,169,110,.5);border-radius:var(--rayon);background:#fff;padding:22px 22px 10px;margin:0 0 22px;min-width:0}
#sim legend{font-family:var(--serif);font-size:1.55rem;font-weight:600;padding:0 10px;color:var(--noir)}
#sim h3{font-family:var(--serif);font-size:1.25rem;margin:8px 0 10px;color:var(--noir)}
#sim .opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:0 0 10px;border:1px solid #e4d9c9;border-radius:12px;background:var(--creme);cursor:pointer;line-height:1.4}
#sim .opt:has(input:checked){border-color:var(--or);background:#fff;box-shadow:0 0 0 2px rgba(201,169,110,.4)}
#sim .opt input{margin-top:4px;accent-color:var(--or-fonce);flex:none}
#sim .opt b{display:block;font-weight:600}
#sim .opt em{display:block;font-style:normal;color:var(--or-fonce);font-weight:500}
#sim .opt small{display:block;color:var(--gris)}
#sim .hint{color:var(--gris);font-size:.88rem;margin:-4px 0 14px}
#sim .res{border:1px solid var(--or);border-radius:var(--rayon);background:#fff;padding:24px 22px;margin:0 0 22px}
#sim .res h2{font-family:var(--serif);margin:0 0 12px}
#sim .res table{width:100%;border-collapse:collapse}
#sim .res td{padding:8px 0;border-bottom:1px solid #eee3d3;vertical-align:top}
#sim .res td:last-child{text-align:right;white-space:nowrap;font-weight:500}
#sim .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-family:var(--serif);font-size:1.7rem;font-weight:700}
#sim .tot span:last-child{color:var(--or-fonce)}
#sim .note{background:var(--creme2);border-left:3px solid var(--or);border-radius:10px;padding:12px 14px;margin:14px 0 0;font-size:.92rem}
#sim .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="pagehead"><div class="wrap">
<span class="eyebrow">Devis</span>
<h1>Simulez votre devis en 1 minute</h1>
<p class="lead">Choisissez votre mode de financement et vos formations : le total s'affiche aussitôt.</p>
</div></div>
<section>
<div class="wrap narrow">
<div id="sim"></div>
<p style="margin-top:24px"><small>Estimation indicative, non contractuelle. Le devis définitif est établi après validation de votre dossier.</small></p>
</div>
</section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function(){
var F=window.FORMATIONS||[],root=document.getElementById('sim'),fin='auto',sel={};
function eur(n){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(n)+' €';}
function price(t){return fin==='cpf'?(t.cpf?0:null):t.prix;}
function opt(type,name,val,checked,t,p,n,dis){return '<label class="opt"><input type="'+type+'" name="'+name+'" value="'+val+'"'+(checked?' checked':'')+(dis?' disabled':'')+'><span><b>'+t+'</b>'+(p?'<em>'+p+'</em>':'')+(n?'<small>'+n+'</small>':'')+'</span></label>';}
function render(){
var h='<fieldset><legend>1. Votre financement</legend>'+
opt('radio','fin','auto',fin==='auto','Autofinancement','','Virement, Wero, carte bancaire ou espèces. Pas de chèque.')+
opt('radio','fin','cpf',fin==='cpf','CPF','','Tarif communiqué sur demande.')+'</fieldset>';
h+='<fieldset><legend>2. Vos formations</legend>';
F.forEach(function(f){h+='<h3>'+f.titre+'</h3>';(f.tarifs||[]).forEach(function(t,i){var k=f.id+'|'+i,p=price(t),dis=(p==null);h+=opt('checkbox','f',k,!!sel[k]&&!dis,t.label,dis?'Non disponible en CPF':(fin==='cpf'?'Tarif sur demande':eur(p)),'',dis);});});
h+='</fieldset>';
var lines='',total=0,n=0;
F.forEach(function(f){(f.tarifs||[]).forEach(function(t,i){var k=f.id+'|'+i,p=price(t);if(sel[k]&&p!=null){n++;total+=p;lines+='<tr><td>'+f.titre.split(' — ')[0]+'<br><small>'+t.label+'</small></td><td>'+(fin==='cpf'?'Sur demande':eur(p))+'</td></tr>';}});});
h+='<div class="res"><h2>Votre résultat</h2>';
if(!n){h+='<p>Sélectionnez au moins une formation pour voir votre total.</p>';}
else{
h+='<table>'+lines+'</table><div class="tot"><span>Total</span><span>'+(fin==='cpf'?'Sur demande':eur(total))+'</span></div>';
if(fin==='cpf')h+='<div class="note">En cas de financement par le CPF, le tarif est majoré pour couvrir les frais de gestion de l\'organisme partenaire. Le tarif CPF vous est communiqué sur demande. Un reste à charge de 150 € s\'applique (déduit du tarif CPF), sauf pour les demandeurs d\'emploi et si votre employeur complète le financement. Une identité numérique certifiée (L\'Identité Numérique La Poste ou France Identité) est obligatoire pour toute inscription avec le CPF.</div>';
h+='<div class="btns"><a class="btn" href="inscription.html">Faire ma préinscription</a><a class="btn ghost" href="rendez-vous.html">En parler au téléphone</a></div>';
}
h+='</div>';
root.innerHTML=h;
}
root.addEventListener('change',function(e){var x=e.target;if(x.name==='fin'){fin=x.value;}else if(x.name==='f'){sel[x.value]=x.checked;}render();});
render();
})();
</script>
</body>
</html>
